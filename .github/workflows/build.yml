name: Build installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            artifact: Paperback-Windows
          - os: ubuntu-latest
            target: linux
            artifact: Paperback-Linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Freeze the LibGen engine
        run: npm run freeze

      - name: Build ${{ matrix.target }}
        # --publish never: this workflow publishes releases itself (job below);
        # without it electron-builder tries to publish on tag builds and fails
        # on the missing GH_TOKEN.
        run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          # No code signing configured; build unsigned artifacts.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/Paperback-Windows/*.exe
            artifacts/Paperback-Linux/*.AppImage
          generate_release_notes: true
